name: Windows verification

on:
  push:
    # Direct pushes are verified on the default branch; feature branches are
    # covered by pull_request, which avoids duplicate runs for PR branches.
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      # Use the runner's Git and Rust tools; no third-party workflow actions.
      - name: Check out the requested revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraHeader=AUTHORIZATION: basic $header" fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout --detach FETCH_HEAD
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --check
      - name: Check
        run: cargo check --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests without an interactive desktop
        # Matches the documented invocation in README.md: Win32-state tests run
        # with --test-threads=1; the interactive tray lifecycle test is skipped.
        run: cargo test --locked -- --test-threads=1 --skip test_tray_manager_lifecycle
      - name: Release build
        run: cargo build --release --locked
      - name: Release size
        run: |
          $size = (Get-Item target/release/isolmass.exe).Length
          if ($size -gt 2621440) { throw "Executable exceeds the 2.5 MiB budget: $size bytes" }
          "Executable: $size bytes" >> $env:GITHUB_STEP_SUMMARY
      - name: Provision NSIS
        # NSIS is an existing build prerequisite; Chocolatey is preinstalled on
        # the runner and puts makensis.exe on PATH for package.bat.
        run: choco install nsis -y --no-progress
      - name: Non-interactive packaging
        # The runner verifies build/version/size/digest without a private key.
        # Public releases are signed only on the approved publisher workstation
        # and verified with --verify-update before uploading.
        run: |
          cmd /c package.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = (Get-Item target/release/isolmass.exe).Length
          $setup = (Get-Item target/release/isolmass-setup.exe).Length
          if ($bin -gt 2621440) { throw "Executable exceeds the 2.5 MiB budget: $bin bytes" }
          if ($setup -gt 3145728) { throw "Installer exceeds the 3 MiB budget: $setup bytes" }
          $recorded = ((Get-Content target/release/isolmass-setup.exe.sha256) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 target/release/isolmass-setup.exe).Hash.ToLowerInvariant()
          if ($recorded -ne $actual) { throw "Installer SHA-256 mismatch: recorded $recorded, actual $actual" }
          "Installer: $setup bytes`nSHA-256: $actual" >> $env:GITHUB_STEP_SUMMARY
